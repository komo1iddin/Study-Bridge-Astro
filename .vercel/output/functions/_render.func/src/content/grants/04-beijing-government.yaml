# FAQs
faqs:
  uz:
    - id: "faq-1"
      question: "Beijing hukumati granti kimlar uchun?"
      answer: "Beijing hukumati granti xalqaro talabalar uchun mo'ljallangan bo'lib, bakalavr, magistratura va doktorantura dasturlarida o'qimoqchi bo'lgan talabalar uchun ochiq"
    - id: "faq-2"
      question: "Ariza qachon topshiriladi?"
      answer: "Ariza topshirish muddati odatda dekabr oyidan fevral oyi oxirigacha. Aniq sanalar universitetlar veb-saytlarida e'lon qilinadi."
    - id: "faq-3"
      question: "Qanday universitetlarda o'qish mumkin?"
      answer: "Grant doirasida Beijing shahrida joylashgan ko'plab universitetlarda o'qish mumkin, jumladan Pekin universiteti, Beijing Normal universiteti va boshqalar."
  ru:
    - id: "faq-1"
      question: "Для кого предназначен грант правительства Пекина?"
      answer: "Грант правительства Пекина предназначен для международных студентов и доступен для студентов, желающих обучаться по программам бакалавриата, магистратуры и докторантуры"
    - id: "faq-2"
      question: "Когда подается заявка?"
      answer: "Срок подачи заявки обычно с декабря до конца февраля. Точные даты объявляются на сайтах университетов."
    - id: "faq-3"
      question: "В каких университетах можно учиться?"
      answer: "В рамках гранта можно учиться во многих университетах, расположенных в Пекине, включая Пекинский университет, Пекинский педагогический университет и другие."
  en:
    - id: "faq-1"
      question: "Who is the Beijing Government Scholarship for?"
      answer: "The Beijing Government Scholarship is designed for international students and is available for students wishing to study in Bachelor's, Master's, and PhD programs"
    - id: "faq-2"
      question: "When is the application period?"
      answer: "The application period is typically from December to the end of February. Exact dates are announced on university websites."
    - id: "faq-3"
      question: "Which universities can I study at?"
      answer: "Under the grant, you can study at many universities located in Beijing, including Peking University, Beijing Normal University, and others." 