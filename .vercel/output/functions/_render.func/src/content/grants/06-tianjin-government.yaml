  uz:
    - title: "Bakalavr uchun 20,000 yuan"
      description: "Bakalavr talabalariga yillik o'qish to'lovlari va yashash xarajatlari uchun 20,000 yuan miqdorida stipendiya to'lanadi"
    - title: "Magistratura uchun 30,000 yuan"
      description: "Magistratura talabalariga yillik o'qish to'lovlari va yashash xarajatlari uchun 30,000 yuan miqdorida stipendiya to'lanadi"
    - title: "Doktorantura uchun 40,000 yuan"
      description: "Doktorantura talabalariga yillik o'qish to'lovlari va yashash xarajatlari uchun 40,000 yuan miqdorida stipendiya to'lanadi"
    - title: "Tibbiy sug'urta"
      description: "Xitoyda bo'lgan vaqtda to'liq tibbiy xizmat va sug'urta bilan ta'minlanadi"
  ru:
    - title: "20,000 юаней для бакалавров"
      description: "Стипендия в размере 20,000 юаней в год выплачивается студентам бакалавриата для покрытия платы за обучение и расходов на проживание"
    - title: "30,000 юаней для магистров"
      description: "Стипендия в размере 30,000 юаней в год выплачивается студентам магистратуры для покрытия платы за обучение и расходов на проживание"
    - title: "40,000 юаней для докторантов"
      description: "Стипендия в размере 40,000 юаней в год выплачивается докторантам для покрытия платы за обучение и расходов на проживание"
    - title: "Медицинская страховка"
      description: "Полное медицинское обслуживание и страхование во время пребывания в Китае"
  en:
    - title: "20,000 yuan for Bachelor's students"
      description: "A scholarship of 20,000 yuan per year is provided to Bachelor's students to cover tuition fees and living expenses"
    - title: "30,000 yuan for Master's students"
      description: "A scholarship of 30,000 yuan per year is provided to Master's students to cover tuition fees and living expenses"
    - title: "40,000 yuan for PhD students"
      description: "A scholarship of 40,000 yuan per year is provided to PhD students to cover tuition fees and living expenses"
    - title: "Medical insurance"
      description: "Full medical service and insurance during your stay in China"

