# FAQs
faqs:
  uz:
    - id: "faq-1"
      question: "Tianjin hukumati granti kimlar uchun?"
      answer: "Tianjin hukumati granti xalqaro talabalar uchun mo'ljallangan bo'lib, bakalavr, magistratura va doktorantura dasturlarida o'qimoqchi bo'lgan talabalar uchun ochiq"
    - id: "faq-2"
      question: "Ariza qachon topshiriladi?"
      answer: "Ariza topshirish muddati odatda mart oyidan iyun oyi o'rtasigacha. Aniq sanalar universitetlar veb-saytlarida e'lon qilinadi."
    - id: "faq-3"
      question: "Qanday universitetlarda o'qish mumkin?"
      answer: "Grant doirasida Tianjin shahrida joylashgan ko'plab universitetlarda o'qish mumkin, jumladan Tianjin universiteti, Nankai universiteti va boshqalar."
  ru:
    - id: "faq-1"
      question: "Для кого предназначен грант правительства Тяньцзиня?"
      answer: "Грант правительства Тяньцзиня предназначен для международных студентов и доступен для студентов, желающих обучаться по программам бакалавриата, магистратуры и докторантуры"
    - id: "faq-2"
      question: "Когда подается заявка?"
      answer: "Срок подачи заявки обычно с марта до середины июня. Точные даты объявляются на сайтах университетов."
    - id: "faq-3"
      question: "В каких университетах можно учиться?"
      answer: "В рамках гранта можно учиться во многих университетах, расположенных в Тяньцзине, включая Тяньцзиньский университет, Университет Нанькай и другие."
  en:
    - id: "faq-1"
      question: "Who is the Tianjin Government Scholarship for?"
      answer: "The Tianjin Government Scholarship is designed for international students and is available for students wishing to study in Bachelor's, Master's, and PhD programs"
    - id: "faq-2"
      question: "When is the application period?"
      answer: "The application period is typically from March to mid-June. Exact dates are announced on university websites."
    - id: "faq-3"
      question: "Which universities can I study at?"
      answer: "Under the grant, you can study at many universities located in Tianjin, including Tianjin University, Nankai University, and others." 