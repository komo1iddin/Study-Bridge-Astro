# Add detailed requirements descriptions
requirementsDetails:
  uz:
    - title: "18-30 yosh oralig'ida bo'lish (bakalavr uchun)"
      description: "Bakalavr dasturlari uchun ariza topshirish vaqtida 30 yoshdan kichik bo'lishingiz kerak. Magistratura uchun ariza topshirayotgan bo'lsangiz, 35 yoshdan kichik bo'lishingiz kerak."
    - title: "O'rta ma'lumot haqidagi hujjat (diploma)"
      description: "Magistratura uchun bachelor darajasi diplomingiz bo'lishi kerak. Doktorantura uchun magistr darajasi diplomingiz bo'lishi kerak."
    - title: "Sog'liq haqida ma'lumotnoma"
      description: "Xalqaro talablarga javob beradigan sog'liq haqida ma'lumotnoma, yuqumli kasalliklar yo'qligini ko'rsatadigan tibbiy tekshiruv natijasi (6 oydan oshmasligi kerak)."
    - title: "Ingliz yoki xitoy tilini bilish"
      description: "Ingliz tilida o'qish uchun TOEFL≥80 yoki IELTS≥6.0 ball; xitoy tilida o'qish uchun HSK 4 yoki undan yuqori daraja talab qilinadi."
  ru:
    - title: "Возраст от 18 до 30 лет (для бакалавриата)"
      description: "Вы должны быть моложе 30 лет на момент подачи заявки для программ бакалавриата. Если вы подаете заявку на магистратуру, вы должны быть моложе 35 лет."
    - title: "Документ о среднем образовании (диплом)"
      description: "Для магистратуры требуется диплом бакалавра. Для докторантуры требуется диплом магистра."
    - title: "Справка о состоянии здоровья"
      description: "Медицинская справка, соответствующая международным требованиям, результат медицинского обследования, подтверждающий отсутствие инфекционных заболеваний (не старше 6 месяцев)."
    - title: "Знание английского или китайского языка"
      description: "Для обучения на английском языке требуется TOEFL≥80 или IELTS≥6.0 баллов; для обучения на китайском языке требуется HSK уровень 4 или выше."
  en:
    - title: "Age between 18-30 years (for Bachelor's)"
      description: "You must be under 30 years old at the time of application for Bachelor's programs. If you're applying for a Master's program, you must be under 35 years old."
    - title: "Diploma of previous education"
      description: "For Master's programs, you need a Bachelor's degree. For PhD programs, you need a Master's degree."
    - title: "Health certificate"
      description: "A health certificate meeting international requirements, showing medical examination results confirming the absence of infectious diseases (not older than 6 months)."
    - title: "English or Chinese language proficiency"
      description: "For English-taught programs: TOEFL≥80 or IELTS≥6.0; for Chinese-taught programs: HSK level 4 or above is required."

